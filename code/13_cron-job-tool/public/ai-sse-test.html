<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SSE Chat 测试</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --glow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.12), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.12), transparent 25%);
            color: var(--text-main);
            padding: 24px 16px;
        }

        .shell {
            width: 100%;
            max-width: 800px;
            animation: fadeIn 0.6s ease-out;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--glow);
        }

        .header-icon svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #fff, #cbd5e1);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            resize: vertical;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.6;
            transition: all 0.3s ease;
            outline: none;
        }

        textarea::placeholder {
            color: #475569;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        button {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        button svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        button:hover:not(:disabled) svg {
            transform: translateX(3px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.8;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
            transition: all 0.3s ease;
        }

        .status-badge.active {
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
            background: rgba(16, 185, 129, 0.1);
        }

        .status-badge.active .status-dot {
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
            animation: pulse 2s infinite;
        }

        .status-badge.error {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.1);
        }

        .status-badge.error .status-dot {
            background: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }

        .output-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .output-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .output-header svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .output {
            padding: 20px;
            border-radius: 12px;
            background: #020617;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            min-height: 160px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .output:empty::before {
            content: 'AI 的回复将显示在这里...';
            color: #475569;
            position: absolute;
            top: 20px;
            left: 20px;
            font-style: italic;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(0.95);
                opacity: 0.8;
            }
        }
    </style>
</head>

<body>
    <div class="shell">
        <div class="card">
            <div class="header">
                <div class="header-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
                <h1>AI 智能助手 (SSE 通信)</h1>
            </div>

            <div class="input-group">
                <label for="query">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
                        </path>
                    </svg>
                    输入你的问题
                </label>
                <textarea id="query" placeholder="例如：帮我查询一下用户 001 的信息，并发送邮件通知他..."></textarea>
            </div>

            <div class="controls">
                <button id="sendBtn">
                    <span>发送请求</span>
                    <svg viewBox="0 0 24 24">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
                <div class="status-container">
                    <div class="status-badge" id="statusContainer">
                        <div class="status-dot"></div>
                        <span id="status">待机</span>
                    </div>
                </div>
            </div>

            <div class="output-container">
                <div class="output-header">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="4 17 10 11 4 5"></polyline>
                        <line x1="12" y1="19" x2="20" y2="19"></line>
                    </svg>
                    输出终端
                </div>
                <div class="output" id="output"></div>
            </div>
        </div>
    </div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const queryInput = document.getElementById('query');
        const outputEl = document.getElementById('output');
        const statusEl = document.getElementById('status');
        const statusContainer = document.getElementById('statusContainer');

        let es = null;

        function updateStatus(text, type = 'default') {
            statusEl.textContent = text;
            statusContainer.className = 'status-badge'; // reset
            if (type !== 'default') {
                statusContainer.classList.add(type);
            }
        }

        function closeEventSource() {
            if (es) {
                es.close();
                es = null;
            }
            sendBtn.disabled = false;
        }

        sendBtn.onclick = () => {
            const query = queryInput.value.trim();
            if (!query) {
                updateStatus('请输入问题', 'error');
                setTimeout(() => updateStatus('待机'), 2000);
                return;
            }

            closeEventSource();
            outputEl.textContent = '';
            sendBtn.disabled = true;
            updateStatus('连接中…', 'active');

            const url = `/ai/chat-stream?query=${encodeURIComponent(query)}`;
            es = new EventSource(url);

            es.onopen = () => {
                updateStatus('已连接，正在流式接收', 'active');
            };

            es.onmessage = (event) => {
                // 后端每个 chunk 用 data 发过来
                outputEl.textContent += event.data;
                // Auto scroll to bottom
                outputEl.scrollTop = outputEl.scrollHeight;
            };

            es.onerror = () => {
                updateStatus('连接结束或发生错误', 'error');
                closeEventSource();
            };
        };

        window.addEventListener('beforeunload', closeEventSource);
    </script>
</body>

</html>
