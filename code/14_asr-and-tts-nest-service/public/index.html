<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>AI 助手</title>

    <style>
      :root {
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --border-color: rgba(226, 232, 240, 0.6);
        --glass-bg: rgba(255, 255, 255, 0.75);
        --glass-border: rgba(255, 255, 255, 0.4);
        --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        color: var(--text-primary);
        background-color: #e0eafc;
        background-image:
          radial-gradient(at 40% 20%, hsla(228, 100%, 74%, 0.5) 0px, transparent 50%),
          radial-gradient(at 80% 0%, hsla(189, 100%, 56%, 0.5) 0px, transparent 50%),
          radial-gradient(at 0% 50%, hsla(355, 100%, 93%, 0.5) 0px, transparent 50%),
          radial-gradient(at 80% 50%, hsla(340, 100%, 76%, 0.5) 0px, transparent 50%),
          radial-gradient(at 0% 100%, hsla(22, 100%, 77%, 0.5) 0px, transparent 50%),
          radial-gradient(at 80% 100%, hsla(242, 100%, 70%, 0.5) 0px, transparent 50%),
          radial-gradient(at 0% 0%, hsla(343, 100%, 76%, 0.5) 0px, transparent 50%);
        background-attachment: fixed;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .page {
        width: 100%;
        max-width: 900px;
        margin: 0;
        padding: 0;
      }

      .chat-shell {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 30px;
        box-shadow: var(--glass-shadow);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 88vh;
        max-height: 850px;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .chat-shell:hover {
        box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.15);
      }

      .header {
        padding: 24px 30px;
        border-bottom: 1px solid var(--border-color);
        background: rgba(255, 255, 255, 0.3);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        position: relative;
      }

      .title {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #1e3a8a, #4f46e5, #9333ea);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: gradientText 5s ease infinite;
        background-size: 200% 200%;
      }

      @keyframes gradientText {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .subtitle {
        margin-top: 8px;
        color: var(--text-secondary);
        font-size: 14px;
        font-weight: 500;
      }

      .status-pill {
        display: inline-flex;
        margin-top: 14px;
        padding: 6px 16px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.8);
        color: #475569;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
        transition: all 0.3s ease;
      }

      .messages {
        flex: 1;
        padding: 30px;
        overflow-y: auto;
        background: transparent;
        scroll-behavior: smooth;
        min-height: 0;
      }

      .messages::-webkit-scrollbar {
        width: 8px;
      }
      .messages::-webkit-scrollbar-track {
        background: transparent;
      }
      .messages::-webkit-scrollbar-thumb {
        background-color: rgba(148, 163, 184, 0.4);
        border-radius: 10px;
      }
      .messages::-webkit-scrollbar-thumb:hover {
        background-color: rgba(148, 163, 184, 0.6);
      }

      .empty {
        text-align: center;
        color: #94a3b8;
        margin-top: 60px;
        font-size: 16px;
        font-weight: 500;
        opacity: 0.8;
      }

      .msg-row {
        display: flex;
        margin-bottom: 24px;
        animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .msg-row.user {
        justify-content: flex-end;
      }

      .msg-row.assistant {
        justify-content: flex-start;
      }

      .bubble {
        max-width: 82%;
        border-radius: 22px;
        padding: 16px 20px;
        white-space: pre-wrap;
        line-height: 1.65;
        font-size: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        position: relative;
        word-wrap: break-word;
      }

      .msg-row.user .bubble {
        background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
        color: white;
        border-bottom-right-radius: 6px;
        border: none;
      }

      .msg-row.user .meta {
        color: rgba(255, 255, 255, 0.7);
        text-align: right;
      }

      .msg-row.assistant .bubble {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: var(--text-primary);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-bottom-left-radius: 6px;
      }

      .meta {
        margin-top: 8px;
        font-size: 11px;
        font-weight: 500;
        color: #94a3b8;
      }

      .composer {
        border-top: 1px solid var(--border-color);
        padding: 24px 30px;
        background: rgba(255, 255, 255, 0.4);
        position: relative;
      }

      .toolbar {
        display: flex;
        gap: 14px;
        align-items: flex-end;
      }

      .input-wrap {
        flex: 1;
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 20px;
        padding: 14px 18px;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .input-wrap:focus-within {
        border-color: #8b5cf6;
        background: #ffffff;
        box-shadow:
          0 0 0 4px rgba(139, 92, 246, 0.15),
          inset 0 2px 4px rgba(0, 0, 0, 0.01);
      }

      .prompt-input {
        width: 100%;
        border: none;
        outline: none;
        resize: none;
        min-height: 52px;
        max-height: 140px;
        font-size: 15px;
        line-height: 1.6;
        font-family: inherit;
        color: var(--text-primary);
        background: transparent;
      }

      .prompt-input::placeholder {
        color: #a1a1aa;
        font-weight: 400;
      }

      .btn {
        border: none;
        color: var(--text-primary);
        padding: 0 24px;
        border-radius: 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 52px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none !important;
      }

      .btn:active:not(:disabled) {
        transform: scale(0.95);
      }

      .btn-primary {
        background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
        color: #fff;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      }

      .btn-primary:hover:not(:disabled) {
        box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
        filter: brightness(1.05);
      }

      .btn-voice {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(226, 232, 240, 0.8);
        min-width: 110px;
        color: var(--text-primary);
      }

      .btn-voice:hover:not(:disabled) {
        background: #ffffff;
        border-color: #cbd5e1;
      }

      .btn-voice.btn-primary {
        background: linear-gradient(135deg, #ef4444 0%, #f43f5e 100%);
        border: none;
        color: white;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        animation: pulseRecording 1.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }

      @keyframes pulseRecording {
        0% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
        }
        70% {
          box-shadow: 0 0 0 12px rgba(239, 68, 68, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
        }
      }

      .hint {
        margin-top: 18px;
        text-align: center;
        color: #94a3b8;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.3px;
      }

      .typing::after {
        content: '● ● ●';
        margin-left: 8px;
        letter-spacing: 3px;
        font-size: 12px;
        color: #4f46e5;
        animation: pulseTyping 1.4s infinite ease-in-out;
      }

      @keyframes pulseTyping {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(0.9);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <section class="chat-shell">
        <header class="header">
          <h1 class="title">AI 助手</h1>

          <div class="subtitle">录音后自动识别，再调用 AI 流式回复</div>

          <div
            class="status-pill"
            id="status"
          >
            状态：未开始
          </div>
        </header>

        <section
          class="messages"
          id="messages"
        >
          <div
            class="empty"
            id="emptyTip"
          >
            点击下方开始录音，体验语音问答。
          </div>
        </section>

        <footer class="composer">
          <div class="toolbar">
            <div class="input-wrap">
              <textarea
                class="prompt-input"
                id="promptInput"
                placeholder="在此输入您的问题，按 Enter 键发送 (Shift+Enter 换行)..."
              ></textarea>
            </div>
            <button
              class="btn btn-voice"
              id="recordBtn"
            >
              语音输入
            </button>
            <button
              class="btn btn-primary"
              id="sendBtn"
            >
              发送
            </button>
          </div>

          <div class="hint">
            文字直问：/ai/chat/stream；语音链路：/speech/asr -> /ai/chat/stream
          </div>
        </footer>
      </section>
    </main>

    <script>
      const promptInput = document.getElementById('promptInput');
      const sendBtn = document.getElementById('sendBtn');
      const recordBtn = document.getElementById('recordBtn');
      const statusEl = document.getElementById('status');
      const messagesEl = document.getElementById('messages');
      const emptyTipEl = document.getElementById('emptyTip');

      let mediaRecorder = null;
      let chunks = [];
      let activeStream = null;
      let activeAssistantContentEl = null;
      let activeAssistantMetaEl = null;
      let activeRecordStream = null;
      let isRecording = false;

      function setStatus(text, isTyping = false) {
        statusEl.textContent = '状态：' + text;
        statusEl.classList.toggle('typing', isTyping);
      }

      function nowTime() {
        return new Date().toLocaleTimeString('zh-CN', { hour12: false });
      }

      function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function hideEmptyTip() {
        if (emptyTipEl) {
          emptyTipEl.style.display = 'none';
        }
      }

      function appendMessage(role, text, metaText) {
        hideEmptyTip();
        const row = document.createElement('div');
        row.className = 'msg-row ' + role;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        const content = document.createElement('div');
        content.textContent = text;

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = metaText || nowTime();

        bubble.appendChild(content);
        bubble.appendChild(meta);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        scrollToBottom();

        return { row, bubble, content, meta };
      }

      function closeActiveStream() {
        if (activeStream) {
          activeStream.close();
          activeStream = null;
        }
      }

      function setRecordingUI(recording) {
        isRecording = recording;
        recordBtn.textContent = recording ? '停止录音' : '语音输入';
        recordBtn.classList.toggle('btn-primary', recording);
      }

      async function uploadAndRecognize(blob) {
        const formData = new FormData();
        formData.append('audio', blob, 'record.ogg');

        const response = await fetch('/speech/asr', {
          method: 'POST',
          body: formData,
        });
        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || 'ASR 请求失败');
        }
        const data = await response.json();
        return data.text || '';
      }

      function streamAiReply(query) {
        return new Promise((resolve) => {
          closeActiveStream();

          const aiMsg = appendMessage('assistant', '', 'AI 正在回答...');
          activeAssistantContentEl = aiMsg.content;
          activeAssistantMetaEl = aiMsg.meta;

          const url = '/ai/chat/stream?query=' + encodeURIComponent(query);
          const es = new EventSource(url);
          let aiResult = '';
          activeStream = es;

          es.onmessage = (event) => {
            aiResult += event.data || '';
            activeAssistantContentEl.textContent = aiResult || '（空结果）';
            scrollToBottom();
          };

          es.onerror = () => {
            es.close();
            if (activeStream === es) {
              activeStream = null;
            }
            if (activeAssistantMetaEl) {
              activeAssistantMetaEl.textContent = 'AI 回复完成 ' + nowTime();
            }
            resolve(aiResult);
          };
        });
      }

      async function askWithQuery(query, source) {
        const trimmed = query.trim();
        if (!trimmed) {
          setStatus('请输入问题');
          return;
        }

        appendMessage('user', trimmed, source + ' ' + nowTime());
        promptInput.value = '';
        sendBtn.disabled = true;
        setStatus('AI 正在流式回答...', true);

        try {
          await streamAiReply(trimmed);
          setStatus('对话完成');
        } catch (error) {
          appendMessage(
            'assistant',
            '处理失败：' + (error.message || String(error)),
            '异常 ' + nowTime()
          );
          setStatus('处理失败');
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener('click', async () => {
        await askWithQuery(promptInput.value, '文本消息');
      });

      promptInput.addEventListener('keydown', async (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          await askWithQuery(promptInput.value, '文本消息');
        }
      });

      recordBtn.addEventListener('click', async () => {
        if (isRecording) {
          if (mediaRecorder) {
            mediaRecorder.stop();
            setStatus('已停止录音，正在识别...');
          }
          return;
        }

        try {
          closeActiveStream();
          activeRecordStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          chunks = [];
          const preferredMimeType = 'audio/ogg;codecs=opus';
          mediaRecorder = MediaRecorder.isTypeSupported(preferredMimeType)
            ? new MediaRecorder(activeRecordStream, { mimeType: preferredMimeType })
            : new MediaRecorder(activeRecordStream);

          mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              chunks.push(event.data);
            }
          };

          mediaRecorder.onstop = async () => {
            try {
              const blob = new Blob(chunks, {
                type: mediaRecorder.mimeType || 'audio/webm',
              });
              if (!blob.size) {
                throw new Error('录音数据为空，请至少录制 1 秒再上传');
              }

              setStatus('语音识别中...');
              const recognized = (await uploadAndRecognize(blob)).trim();
              promptInput.value = recognized;

              if (!recognized) {
                setStatus('识别为空，请重新录音');
                return;
              }

              await askWithQuery(recognized, '语音消息');
            } catch (error) {
              appendMessage(
                'assistant',
                '语音处理失败：' + (error.message || String(error)),
                '异常 ' + nowTime()
              );
              setStatus('语音处理失败');
            } finally {
              if (activeRecordStream) {
                activeRecordStream.getTracks().forEach((t) => t.stop());
                activeRecordStream = null;
              }
              setRecordingUI(false);
            }
          };

          mediaRecorder.start(250);
          setRecordingUI(true);
          setStatus('录音中，点击“停止录音”完成提问');
        } catch (error) {
          appendMessage(
            'assistant',
            '无法开始录音：' + (error.message || String(error)),
            '异常 ' + nowTime()
          );
          setStatus('无法开始录音');
          setRecordingUI(false);
        }
      });
    </script>
  </body>
</html>
