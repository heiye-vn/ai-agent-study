<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>AI 助手</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-start: #0f0c29;
        --bg-mid: #1a1a40;
        --bg-end: #24243e;
        --card: rgba(255, 255, 255, 0.06);
        --card-border: rgba(255, 255, 255, 0.1);
        --text: #e8eaf0;
        --text-secondary: #9ca3b4;
        --muted: #6b7280;
        --primary: #6c63ff;
        --primary-glow: rgba(108, 99, 255, 0.35);
        --primary-soft: rgba(108, 99, 255, 0.15);
        --accent: #00d4aa;
        --accent-glow: rgba(0, 212, 170, 0.3);
        --user-bubble: linear-gradient(135deg, #6c63ff 0%, #4f46e5 100%);
        --assistant-bubble: rgba(255, 255, 255, 0.07);
        --border: rgba(255, 255, 255, 0.08);
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        --radius: 20px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
        position: relative;
        overflow-x: hidden;
      }

      /* 动态网格背景装饰 */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 600px 400px at 15% 20%, rgba(108, 99, 255, 0.15), transparent),
          radial-gradient(ellipse 500px 350px at 85% 75%, rgba(0, 212, 170, 0.1), transparent),
          radial-gradient(ellipse 400px 300px at 50% 10%, rgba(168, 85, 247, 0.08), transparent);
        pointer-events: none;
        z-index: 0;
      }

      .page {
        position: relative;
        z-index: 1;
        max-width: 920px;
        margin: 24px auto;
        padding: 0 16px;
      }

      .chat-shell {
        border: 1px solid var(--card-border);
        border-radius: var(--radius);
        background: var(--card);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      /* 头部 */
      .header {
        padding: 22px 24px 18px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(108, 99, 255, 0.08) 0%, transparent 100%);
        position: relative;
      }

      .title {
        font-size: 22px;
        font-weight: 700;
        background: linear-gradient(135deg, #fff 0%, #c4b5fd 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        margin-top: 6px;
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 400;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 12px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
        transition: var(--transition);
      }

      .status-pill.typing {
        background: var(--primary-soft);
        border-color: rgba(108, 99, 255, 0.3);
        color: #c4b5fd;
      }

      /* 消息区域 */
      .messages {
        padding: 24px 20px;
        min-height: 430px;
        max-height: 62vh;
        overflow-y: auto;
        background: transparent;
        scroll-behavior: smooth;
      }

      .messages::-webkit-scrollbar {
        width: 5px;
      }
      .messages::-webkit-scrollbar-track {
        background: transparent;
      }
      .messages::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 10px;
      }
      .messages::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .empty {
        text-align: center;
        color: var(--muted);
        margin-top: 60px;
        font-size: 14px;
        line-height: 2;
      }

      .msg-row {
        display: flex;
        margin-bottom: 16px;
        animation: msgIn 0.35s ease-out;
      }

      @keyframes msgIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .msg-row.user {
        justify-content: flex-end;
      }
      .msg-row.assistant {
        justify-content: flex-start;
      }

      .bubble {
        max-width: min(680px, 84%);
        border-radius: 18px;
        padding: 14px 18px;
        white-space: pre-wrap;
        line-height: 1.6;
        font-size: 14px;
        border: 1px solid transparent;
        word-break: break-word;
      }

      .msg-row.user .bubble {
        background: var(--user-bubble);
        color: #fff;
        border-radius: 18px 18px 6px 18px;
        box-shadow: 0 4px 20px var(--primary-glow);
      }

      .msg-row.assistant .bubble {
        background: var(--assistant-bubble);
        border-color: var(--border);
        border-radius: 18px 18px 18px 6px;
        backdrop-filter: blur(8px);
      }

      .meta {
        margin-top: 6px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.35);
        font-weight: 400;
      }

      /* 底部输入区 */
      .composer {
        border-top: 1px solid var(--border);
        padding: 16px 20px;
        background: rgba(0, 0, 0, 0.15);
        backdrop-filter: blur(12px);
      }

      .toolbar {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      .input-wrap {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.05);
        transition: var(--transition);
      }

      .input-wrap:focus-within {
        border-color: rgba(108, 99, 255, 0.5);
        box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.12);
        background: rgba(255, 255, 255, 0.07);
      }

      .prompt-input {
        width: 100%;
        border: none;
        outline: none;
        resize: none;
        min-height: 44px;
        max-height: 130px;
        font-size: 14px;
        line-height: 1.6;
        font-family: inherit;
        background: transparent;
        color: var(--text);
      }

      .prompt-input::placeholder {
        color: var(--muted);
      }

      .btn {
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        padding: 10px 18px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition: var(--transition);
        white-space: nowrap;
      }

      .btn:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-1px);
      }

      .btn:active:not(:disabled) {
        transform: scale(0.97);
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn-primary {
        background: linear-gradient(135deg, #6c63ff, #4f46e5);
        border-color: transparent;
        color: #fff;
        box-shadow: 0 4px 16px var(--primary-glow);
      }

      .btn-primary:hover:not(:disabled) {
        box-shadow: 0 6px 24px rgba(108, 99, 255, 0.5);
        background: linear-gradient(135deg, #7c74ff, #5b52f0);
      }

      .btn-voice {
        min-width: 100px;
        position: relative;
        overflow: hidden;
      }

      .btn-voice.btn-primary::before {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: 14px;
        background: linear-gradient(135deg, #ef4444, #f97316);
        z-index: -1;
        animation: recPulse 1.5s ease-in-out infinite;
      }

      .btn-voice.btn-primary {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
      }

      @keyframes recPulse {
        0%,
        100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }

      .hint {
        margin-top: 10px;
        color: var(--muted);
        font-size: 11px;
        opacity: 0.7;
      }

      .audio-bar {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .audio-bar audio {
        flex: 1;
        height: 36px;
        border-radius: 8px;
        filter: invert(1) hue-rotate(180deg) brightness(0.85);
      }

      /* 打字动画 */
      .typing::after {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-left: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow:
          12px 0 0 var(--accent),
          24px 0 0 var(--accent);
        animation: dotBounce 1.2s ease-in-out infinite;
      }

      @keyframes dotBounce {
        0%,
        80%,
        100% {
          opacity: 0.3;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1.1);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="chat-shell">
        <header class="header">
          <h1 class="title">✦ AI 助手</h1>
          <div class="subtitle">语音识别 → AI 流式回复 → 语音合成，全链路体验</div>
          <div
            class="status-pill"
            id="status"
          >
            状态：未开始
          </div>
        </header>

        <section
          class="messages"
          id="messages"
        >
          <div
            class="empty"
            id="emptyTip"
          >
            🎙️ 点击下方「语音输入」开始录音<br />或直接输入文字，体验 AI 对话
          </div>
        </section>

        <footer class="composer">
          <div class="toolbar">
            <div class="input-wrap">
              <textarea
                class="prompt-input"
                id="promptInput"
                placeholder="输入问题，回车发送（Shift+Enter 换行）"
              ></textarea>
            </div>
            <button
              class="btn btn-voice"
              id="recordBtn"
            >
              🎤 语音输入
            </button>
            <button
              class="btn btn-primary"
              id="sendBtn"
            >
              发送 →
            </button>
          </div>
          <div class="hint">
            文字直问：/ai/chat/stream · 语音链路：/speech/asr → /ai/chat/stream ·
            语音合成：/speech/tts/ws
          </div>
          <div class="audio-bar">
            <span>🔊 AI 语音</span>
            <audio
              id="ttsAudio"
              controls
              preload="none"
            ></audio>
          </div>
        </footer>
      </section>
    </main>

    <script>
      const promptInput = document.getElementById('promptInput');
      const sendBtn = document.getElementById('sendBtn');
      const recordBtn = document.getElementById('recordBtn');
      const statusEl = document.getElementById('status');
      const messagesEl = document.getElementById('messages');
      const emptyTipEl = document.getElementById('emptyTip');
      const ttsAudioEl = document.getElementById('ttsAudio');

      let mediaRecorder = null;
      let chunks = [];
      let activeStream = null;
      let activeAssistantContentEl = null;
      let activeAssistantMetaEl = null;
      let activeRecordStream = null;
      let isRecording = false;
      let ttsWs = null;
      let ttsSessionId = null;
      let audioCtx = null;
      let audioDest = null;
      let nextPlayTime = 0;
      let ttsStreamFinal = false;

      function setStatus(text, isTyping = false) {
        statusEl.textContent = '状态：' + text;
        statusEl.classList.toggle('typing', isTyping);
      }

      function nowTime() {
        return new Date().toLocaleTimeString('zh-CN', { hour12: false });
      }

      function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function hideEmptyTip() {
        if (emptyTipEl) {
          emptyTipEl.style.display = 'none';
        }
      }

      function appendMessage(role, text, metaText) {
        hideEmptyTip();
        const row = document.createElement('div');
        row.className = 'msg-row ' + role;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        const content = document.createElement('div');
        content.textContent = text;

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = metaText || nowTime();

        bubble.appendChild(content);
        bubble.appendChild(meta);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        scrollToBottom();

        return { row, bubble, content, meta };
      }

      function closeActiveStream() {
        if (activeStream) {
          activeStream.close();
          activeStream = null;
        }
      }

      function closeTtsWs() {
        if (ttsWs) {
          ttsWs.close();
          ttsWs = null;
        }
        ttsSessionId = null;
        resetTtsPlayer();
      }

      function resetTtsPlayer() {
        ttsStreamFinal = false;
        nextPlayTime = 0;
        if (audioCtx && audioCtx.state !== 'closed') {
          // 不关闭整个 context，以免后续无法播放，只是重置时间
          nextPlayTime = audioCtx.currentTime;
        }
        ttsAudioEl.pause();
      }

      function prepareStreamingAudio() {
        resetTtsPlayer();
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          audioDest = audioCtx.createMediaStreamDestination();
          ttsAudioEl.srcObject = audioDest.stream;
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playPcmChunk(arrayBuffer) {
        if (!audioCtx) return;

        // 腾讯云 TTS PCM 格式：16000Hz 16bit 单声道 little-endian
        const int16Array = new Int16Array(arrayBuffer);
        const float32Array = new Float32Array(int16Array.length);
        for (let i = 0; i < int16Array.length; i++) {
          float32Array[i] = int16Array[i] / 32768; // 归一化到 [-1, 1]
        }

        const audioBuffer = audioCtx.createBuffer(1, float32Array.length, 16000);
        audioBuffer.getChannelData(0).set(float32Array);

        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;

        // 连到 destination (扬声器) 和 audioDest (为了 audio 标签可视化)
        // source.connect(audioCtx.destination);
        // 仅连到 audioDest，由 audio 标签全权负责播放声音，避免两路声音重叠导致重音
        source.connect(audioDest);

        // 队列播放，确保没有断音
        const currentTime = audioCtx.currentTime;
        if (nextPlayTime < currentTime) {
          nextPlayTime = currentTime;
        }
        source.start(nextPlayTime);
        nextPlayTime += audioBuffer.duration;

        // 尝试自动播放 audio 标签以更新其进度UI
        ttsAudioEl.play().catch(() => {});
      }

      function setRecordingUI(recording) {
        isRecording = recording;
        recordBtn.textContent = recording ? '⏹ 停止录音' : '🎤 语音输入';
        recordBtn.classList.toggle('btn-primary', recording);
      }

      async function uploadAndRecognize(blob) {
        const formData = new FormData();
        formData.append('audio', blob, 'record.ogg');

        const response = await fetch('/speech/asr', {
          method: 'POST',
          body: formData,
        });
        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || 'ASR 请求失败');
        }
        const data = await response.json();
        return data.text || '';
      }

      function ensureTtsConnection() {
        return new Promise((resolve) => {
          if (ttsWs && ttsWs.readyState === WebSocket.OPEN && ttsSessionId) {
            resolve();
            return;
          }

          const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
          const wsUrl = `${protocol}://${window.location.host}/speech/tts/ws`;
          const ws = new WebSocket(wsUrl);
          ws.binaryType = 'arraybuffer';
          ttsWs = ws;

          ws.onopen = () => {
            // 等待 sessionId 消息
          };

          ws.onmessage = (event) => {
            if (typeof event.data === 'string') {
              try {
                const msg = JSON.parse(event.data);
                if (msg.type === 'session' && msg.sessionId) {
                  ttsSessionId = msg.sessionId;
                  resolve();
                } else if (msg.type === 'tts_started') {
                  prepareStreamingAudio();
                } else if (msg.type === 'tts_final' || msg.type === 'tts_closed') {
                  ttsStreamFinal = true;
                } else if (msg.type === 'tts_error') {
                  ttsStreamFinal = true;
                }
              } catch {
                // ignore
              }
            } else if (event.data instanceof ArrayBuffer) {
              playPcmChunk(event.data);
            }
          };

          ws.onerror = () => {
            closeTtsWs();
            resolve();
          };

          ws.onclose = () => {
            ttsWs = null;
          };
        });
      }

      function streamAiReply(query) {
        return new Promise((resolve) => {
          closeActiveStream();

          const aiMsg = appendMessage('assistant', '', 'AI 正在回答...');
          activeAssistantContentEl = aiMsg.content;
          activeAssistantMetaEl = aiMsg.meta;

          const url =
            '/ai/chat/stream?query=' +
            encodeURIComponent(query) +
            (ttsSessionId ? '&ttsSessionId=' + encodeURIComponent(ttsSessionId) : '');
          const es = new EventSource(url);
          let aiResult = '';
          activeStream = es;

          es.onmessage = (event) => {
            aiResult += event.data || '';
            activeAssistantContentEl.textContent = aiResult || '（空结果）';
            scrollToBottom();
          };

          es.onerror = () => {
            es.close();
            if (activeStream === es) {
              activeStream = null;
            }
            if (activeAssistantMetaEl) {
              activeAssistantMetaEl.textContent = 'AI 回复完成 ' + nowTime();
            }
            resolve(aiResult);
          };
        });
      }

      async function askWithQuery(query, source) {
        const trimmed = query.trim();
        if (!trimmed) {
          setStatus('请输入问题');
          return;
        }

        appendMessage('user', trimmed, source + ' ' + nowTime());
        promptInput.value = '';
        sendBtn.disabled = true;
        setStatus('AI 正在流式回答...', true);

        try {
          await ensureTtsConnection();
          await streamAiReply(trimmed);
          setStatus('对话完成');
        } catch (error) {
          appendMessage(
            'assistant',
            '处理失败：' + (error.message || String(error)),
            '异常 ' + nowTime()
          );
          setStatus('处理失败');
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener('click', async () => {
        await askWithQuery(promptInput.value, '文字提问');
      });

      promptInput.addEventListener('keydown', async (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          await askWithQuery(promptInput.value, '文字提问');
        }
      });

      recordBtn.addEventListener('click', async () => {
        if (isRecording) {
          if (mediaRecorder) {
            mediaRecorder.stop();
            setStatus('已停止录音，正在识别...');
          }
          return;
        }

        try {
          closeActiveStream();
          // 语音通道与文字通道解耦，不关闭 TTS WS，方便连续对话复用 session
          activeRecordStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          chunks = [];
          const preferredMimeType = 'audio/ogg;codecs=opus';
          mediaRecorder = MediaRecorder.isTypeSupported(preferredMimeType)
            ? new MediaRecorder(activeRecordStream, { mimeType: preferredMimeType })
            : new MediaRecorder(activeRecordStream);

          mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              chunks.push(event.data);
            }
          };

          mediaRecorder.onstop = async () => {
            try {
              const blob = new Blob(chunks, {
                type: mediaRecorder.mimeType || 'audio/webm',
              });
              if (!blob.size) {
                throw new Error('录音数据为空，请至少录制 1 秒再上传');
              }

              setStatus('语音识别中...');
              const recognized = (await uploadAndRecognize(blob)).trim();
              promptInput.value = recognized;

              if (!recognized) {
                setStatus('识别为空，请重新录音');
                return;
              }

              await askWithQuery(recognized, '语音提问');
            } catch (error) {
              appendMessage(
                'assistant',
                '语音处理失败：' + (error.message || String(error)),
                '异常 ' + nowTime()
              );
              setStatus('语音处理失败');
            } finally {
              if (activeRecordStream) {
                activeRecordStream.getTracks().forEach((t) => t.stop());
                activeRecordStream = null;
              }
              setRecordingUI(false);
            }
          };

          mediaRecorder.start(250);
          setRecordingUI(true);
          setStatus('录音中，点击“停止录音”完成提问');
        } catch (error) {
          appendMessage(
            'assistant',
            '无法开始录音：' + (error.message || String(error)),
            '异常 ' + nowTime()
          );
          setStatus('无法开始录音');
          setRecordingUI(false);
        }
      });
    </script>
  </body>
</html>
